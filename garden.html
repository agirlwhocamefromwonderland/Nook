<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>garden</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f3ead8">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Vazirmatn:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3ead8;--card:#f8f1e1;--ink:#3b2a1e;--soft:#8a7560;--line:#c9b99a;--accent:#9a4a2c;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17130e;--card:#1e1912;--ink:#e8b86a;--soft:#8f7a52;--line:#3d3322;--accent:#f0a04b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17130e;--card:#1e1912;--ink:#e8b86a;--soft:#8f7a52;--line:#3d3322;--accent:#f0a04b;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:17px/1.65 "Lora","Vazirmatn",Georgia,serif;max-width:620px;margin:0 auto;padding:18px 16px 60px}
[dir=rtl],.fa{font-family:"Vazirmatn","Lora",Tahoma,sans-serif}
header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:16px}
h1{font-size:22px;font-weight:600;margin:0;letter-spacing:.04em}
nav button,.btn{background:none;border:1px solid var(--line);color:var(--ink);font:inherit;font-size:14px;padding:3px 9px;margin-left:4px;cursor:pointer;border-radius:0}
nav button:hover,.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.main{background:var(--ink);color:var(--bg);border-color:var(--ink)}
textarea,input[type=search]{width:100%;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:0;font:inherit;padding:10px;resize:vertical}
textarea:focus,input:focus{outline:1px solid var(--accent)}
.tools{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 8px;align-items:center}
.tools .btn{margin:0;min-width:34px}
.sp{flex:1}
section.panel{border:1px solid var(--line);background:var(--card);padding:12px;margin:12px 0}
.wander{border:1px dashed var(--line);padding:10px 12px;margin:0 0 18px}
.wander h2,.panel h2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);margin:0 0 6px;font-weight:400}
.w{padding:8px 0;border-top:1px solid var(--line)}
.w:first-of-type{border-top:0}
.end{color:var(--soft);font-style:italic;font-size:15px;margin:8px 0 0;text-align:center}
.entry{border-top:1px solid var(--line);padding:14px 0}
.meta{display:flex;gap:10px;font-size:13px;color:var(--soft);align-items:center;flex-wrap:wrap;margin-bottom:4px}
.meta button{background:none;border:0;color:var(--soft);font:inherit;font-size:13px;cursor:pointer;padding:0;text-decoration:underline dotted}
.meta .stage{color:var(--accent);text-decoration:none}
.body>*{margin:.35em 0}
.body h3{font-size:18px;margin:.6em 0 .2em}
.body blockquote{border-inline-start:2px solid var(--accent);margin:.5em 0;padding-inline-start:12px;color:var(--soft)}
.body ul{margin:.3em 0;padding-inline-start:1.3em}
.body a{color:var(--accent)}
a.tag{cursor:pointer;text-decoration:none}
.chips{margin:8px 0}
.chips a{display:inline-block;border:1px solid var(--line);padding:0 8px;margin:2px 4px 2px 0;font-size:14px;cursor:pointer;color:var(--soft)}
.chips a.on{border-color:var(--accent);color:var(--accent)}
.empty{color:var(--soft);text-align:center;padding:30px 0;font-style:italic}
.hide{display:none}
small{color:var(--soft)}
</style>
</head>
<body>
<header><h1>garden</h1>
<nav><button id="nBin">bin</button><button id="nData">backup</button><button id="nTheme">night</button></nav></header>

<div id="wander" class="wander"></div>

<textarea id="box" rows="4" dir="auto" placeholder="write something…"></textarea>
<div class="tools" id="tools">
<button class="btn" data-w="**|**"><b>B</b></button>
<button class="btn" data-w="*|*"><i>I</i></button>
<button class="btn" data-p="# ">H</button>
<button class="btn" data-p="> ">❝</button>
<button class="btn" data-p="- ">•</button>
<button class="btn" data-l="1">link</button>
<span class="sp"></span>
<button class="btn hide" id="cancel">cancel</button>
<button class="btn main" id="save">plant</button>
</div>

<section class="panel hide" id="pData">
<h2>backup</h2>
<p><button class="btn" id="exJson">save backup</button> <button class="btn" id="exMd">save as markdown</button></p>
<p><small>Your entries live only in this browser on this device. Save a backup now and then, and keep the file somewhere safe.</small></p>
<textarea id="io" rows="4" placeholder="paste a backup here to restore it" dir="auto"></textarea>
<p><button class="btn" id="imp">restore</button> <button class="btn" id="showTxt">show backup text</button> <small id="msg"></small></p>
</section>
<section class="panel hide" id="pBin"><h2>bin · kept 30 days</h2><div id="binList"></div></section>

<input type="search" id="q" placeholder="search" dir="auto" style="margin-top:14px">
<div class="chips" id="chips"></div>
<div id="list"></div>

<script>
var KEY="garden:v1", WKEY="garden:wander";
var S=[], filter="", tag="", editId=null, DAY=30*864e5, STAGES=["seed","sprout","evergreen"];
function ls(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lset(k,v){try{localStorage.setItem(k,v)}catch(e){}}
try{S=JSON.parse(ls(KEY)||"[]")}catch(e){S=[]}
if(!Array.isArray(S))S=[];
function persist(){lset(KEY,JSON.stringify(S))}
var $=function(i){return document.getElementById(i)};
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function inl(s){s=esc(s);
 s=s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\*(.+?)\*/g,"<i>$1</i>");
 s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
 s=s.replace(/(^|\s)(https?:\/\/[^\s<]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
 s=s.replace(/(^|\s)#([\p{L}\p{N}_]+)/gu,'$1<a class="tag" data-tag="$2">#$2</a>');return s}
function md(t){var out=[],ul=null;
 t.split("\n").forEach(function(l){
  var m;
  if(m=l.match(/^\s*[-*•]\s+(.*)/)){if(!ul){ul=[];out.push(ul)}ul.push(m[1]);return}
  ul=null;
  if(!l.trim())return;
  if(m=l.match(/^#{1,3}\s+(.*)/))out.push({h:m[1]});
  else if(m=l.match(/^>\s?(.*)/))out.push({q:m[1]});
  else out.push({p:l});
 });
 return out.map(function(b){
  if(Array.isArray(b))return '<ul dir="auto">'+b.map(function(i){return "<li>"+inl(i)+"</li>"}).join("")+"</ul>";
  if(b.h!==undefined)return '<h3 dir="auto">'+inl(b.h)+"</h3>";
  if(b.q!==undefined)return '<blockquote dir="auto">'+inl(b.q)+"</blockquote>";
  return '<p dir="auto">'+inl(b.p)+"</p>"}).join("")}
function fmt(ts){var d=new Date(ts);return d.getFullYear()+"."+("0"+(d.getMonth()+1)).slice(-2)+"."+("0"+d.getDate()).slice(-2)}
function live(){return S.filter(function(e){return !e.del})}
function purge(){var n=Date.now();S=S.filter(function(e){return !e.del||n-e.del<DAY})}
function tends(e){e.tends=(e.tends||0)+1;e.last=Date.now();
 if(e.tends>=4)e.stage=2;else if(e.tends>=1&&e.stage<1)e.stage=1}

/* daily wander */
function rng(seed){var a=0;for(var i=0;i<seed.length;i++)a=(a*31+seed.charCodeAt(i))>>>0;
 return function(){a=(a+0x6D2B79F5)>>>0;var t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function wander(){
 var day=fmt(Date.now()),box=$("wander"),all=live();
 var st;try{st=JSON.parse(ls(WKEY)||"null")}catch(e){st=null}
 if(!st||st.day!==day){
  var pool=all.filter(function(e){return fmt(e.created)!==day});
  if(!pool.length)pool=all.slice();
  var r=rng(day),a=pool.slice();
  for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}
  st={day:day,ids:a.slice(0,3).map(function(e){return e.id}),done:[]};lset(WKEY,JSON.stringify(st))}
 var items=st.ids.map(function(id){return S.find(function(e){return e.id===id&&!e.del})}).filter(Boolean);
 var h='<h2>today’s wander</h2>';
 if(!items.length){box.innerHTML=h+'<p class="end">nothing to wander through yet. plant a few things first.</p>';return}
 items.forEach(function(e){var d=st.done.indexOf(e.id)>-1;
  h+='<div class="w"><div class="meta"><span>'+fmt(e.created)+' · '+STAGES[e.stage||0]+'</span>'+
  (d?'<span>tended ✓</span>':'<button data-tend="'+e.id+'">tend</button>')+'</div><div class="body">'+md(e.text)+'</div></div>'});
 h+='<p class="end">that’s all for today. go look at something real.</p>';
 box.innerHTML=h}

/* render */
function render(){
 purge();
 var tags={};live().forEach(function(e){(e.text.match(/(^|\s)#[\p{L}\p{N}_]+/gu)||[]).forEach(function(t){t=t.trim().slice(1);tags[t]=1})});
 $("chips").innerHTML=Object.keys(tags).sort().map(function(t){return '<a data-tag="'+esc(t)+'" class="'+(t===tag?"on":"")+'">#'+esc(t)+'</a>'}).join("");
 var q=filter.toLowerCase();
 var rows=live().filter(function(e){
  return (!q||e.text.toLowerCase().indexOf(q)>-1)&&(!tag||new RegExp("(^|\\s)#"+tag.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(\\s|$)","u").test(e.text))
 }).sort(function(a,b){return b.created-a.created});
 $("list").innerHTML=rows.length?rows.map(function(e){
  return '<div class="entry"><div class="meta"><span>'+fmt(e.created)+'</span><button class="stage" data-stage="'+e.id+'">'+STAGES[e.stage||0]+'</button><span class="sp"></span><button data-edit="'+e.id+'">edit</button><button data-del="'+e.id+'">delete</button></div><div class="body">'+md(e.text)+"</div></div>"}).join("")
  :'<p class="empty">'+(live().length?"nothing matches.":"an empty garden. plant your first thing above.")+"</p>";
 var b=S.filter(function(e){return e.del});
 $("binList").innerHTML=b.length?b.map(function(e){return '<div class="entry"><div class="body" style="max-height:4.9em;overflow:hidden">'+md(e.text)+'</div><div class="meta"><button data-res="'+e.id+'">restore</button><button data-gone="'+e.id+'">delete forever</button></div></div>'}).join(""):'<p class="empty">bin is empty.</p>';
 wander()}

/* composer */
var box=$("box");
function wrap(a,b){var s=box.selectionStart,e=box.selectionEnd,v=box.value;
 box.value=v.slice(0,s)+a+v.slice(s,e)+b+v.slice(e);box.focus();box.setSelectionRange(s+a.length,e+a.length)}
function pre(p){var s=box.selectionStart,v=box.value,ls0=v.lastIndexOf("\n",s-1)+1;
 box.value=v.slice(0,ls0)+p+v.slice(ls0);box.focus();box.setSelectionRange(s+p.length,s+p.length)}
$("tools").addEventListener("click",function(ev){var b=ev.target.closest("button");if(!b)return;
 if(b.dataset.w){var p=b.dataset.w.split("|");wrap(p[0],p[1])}
 else if(b.dataset.p)pre(b.dataset.p);
 else if(b.dataset.l){var s=box.selectionStart,e=box.selectionEnd,t=box.value.slice(s,e)||"text";
  box.value=box.value.slice(0,s)+"["+t+"](https://)"+box.value.slice(e);box.focus()}});
function reset(){box.value="";editId=null;$("save").textContent="plant";$("cancel").classList.add("hide")}
$("save").onclick=function(){var t=box.value.trim();if(!t)return;
 if(editId){var e=S.find(function(x){return x.id===editId});if(e){e.text=t;tends(e)}}
 else S.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),text:t,created:Date.now(),stage:0,tends:0});
 persist();reset();render()};
$("cancel").onclick=reset;
$("q").oninput=function(){filter=this.value;render()};

/* clicks */
document.addEventListener("click",function(ev){
 var t=ev.target.closest("[data-tag],[data-tend],[data-stage],[data-edit],[data-del],[data-res],[data-gone]");if(!t)return;
 var d=t.dataset,e;
 function f(id){return S.find(function(x){return x.id===id})}
 if(d.tag!==undefined){tag=(tag===d.tag)?"":d.tag;render();return}
 if(d.tend){e=f(d.tend);var st=JSON.parse(ls(WKEY));if(st.done.indexOf(d.tend)<0)st.done.push(d.tend);lset(WKEY,JSON.stringify(st));if(e)tends(e);persist();render();return}
 if(d.stage){e=f(d.stage);e.stage=((e.stage||0)+1)%3;persist();render();return}
 if(d.edit){e=f(d.edit);editId=e.id;box.value=e.text;$("save").textContent="update";$("cancel").classList.remove("hide");box.focus();window.scrollTo(0,0);return}
 if(d.del){f(d.del).del=Date.now();persist();render();return}
 if(d.res){delete f(d.res).del;persist();render();return}
 if(d.gone){S=S.filter(function(x){return x.id!==d.gone});persist();render()}});

/* panels, theme */
$("nBin").onclick=function(){$("pBin").classList.toggle("hide")};
$("nData").onclick=function(){$("pData").classList.toggle("hide")};
var th=ls("garden:theme");if(th)document.documentElement.dataset.theme=th;
$("nTheme").onclick=function(){var dark=getComputedStyle(document.documentElement).getPropertyValue("--bg").trim()==="#17130e";
 th=dark?"light":"dark";document.documentElement.dataset.theme=th;lset("garden:theme",th)};

/* backup */
function note(m){$("msg").textContent=m}
function mdAll(){return live().sort(function(a,b){return a.created-b.created}).map(function(e){return "## "+fmt(e.created)+" ("+STAGES[e.stage||0]+")\n\n"+e.text}).join("\n\n---\n\n")}
function jsonAll(){return JSON.stringify({garden:1,entries:live()},null,1)}
function save(name,data){
 try{var type=/\.json$/.test(name)?"application/json":"text/markdown";
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:type+";charset=utf-8"}));
  a.download=name;document.body.appendChild(a);a.click();a.remove();note("saved to your downloads.")}
 catch(e){$("io").value=data;note("couldn’t save a file. the text is in the box: copy it into a note.")}}
$("exJson").onclick=function(){save("garden-backup-"+fmt(Date.now())+".json",jsonAll())};
$("exMd").onclick=function(){save("garden-"+fmt(Date.now())+".md",mdAll())};
$("showTxt").onclick=function(){$("io").value=jsonAll();note("copy this text somewhere safe.")};
$("imp").onclick=function(){try{var o=JSON.parse($("io").value),n=0;
 (o.entries||[]).forEach(function(e){if(e&&e.id&&e.text&&!S.some(function(x){return x.id===e.id})){S.push(e);n++}});
 persist();render();note(n+" restored.")}catch(e){note("that doesn’t look like a garden backup.")}};

/* shared-in text (Android share menu) */
try{var p=new URLSearchParams(location.search),sh=[p.get("title"),p.get("text"),p.get("url")].filter(Boolean).join("\n");
 if(sh){box.value=sh;history.replaceState(null,"",location.pathname);setTimeout(function(){box.focus()},300)}}catch(e){}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});

render();
</script>
</body>
</html>
